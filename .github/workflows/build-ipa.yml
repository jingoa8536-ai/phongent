name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive without signing
        run: |
          xcodebuild -project ios/MikaRemote.xcodeproj \
            -scheme MikaRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MikaRemote.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/MikaRemote.xcarchive/Products/Applications/MikaRemote.app"
          ls -la "$APP_PATH"
          rm -rf Payload MikaRemote-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MikaRemote-unsigned.ipa Payload
          ls -lh MikaRemote-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MikaRemote-unsigned-ipa
          path: MikaRemote-unsigned.ipa
